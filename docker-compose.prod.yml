# Production stack for the OCI server. Images are built and pushed by
# .github/workflows/deploy.yml; nothing is built on the server.
# Needs a .env beside this file (see README: Deployment).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medicare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${IMAGE_PREFIX:?}/medicare-ai-backend:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    # Load the whole .env so every provider key/model/base URL (GEMINI_API_KEY, NVIDIA_*, OPENROUTER_*,
    # OPENAI_*, GROQ_*, LLM_CUSTOM_PROVIDERS, ...) reaches the app. Values under `environment:` win.
    env_file: .env
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://medicare:${POSTGRES_PASSWORD}@postgres:5432/medicare
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS in .env, e.g. https://app.example.com}
      GOOGLE_REDIRECT_URI: ${FRONTEND_ORIGINS}/api/v1/auth/google/callback
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-MediCare AI <no-reply@localhost>}
      STORAGE_DIR: /data/files
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    image: ${IMAGE_PREFIX:?}/medicare-ai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Load the whole .env so every provider key/model/base URL (GEMINI_API_KEY, NVIDIA_*, OPENROUTER_*,
    # OPENAI_*, GROQ_*, LLM_CUSTOM_PROVIDERS, ...) reaches the app. Values under `environment:` win.
    env_file: .env
    environment: *api-env
    # Push credentials (FCM service-account JSON) live in ./secrets next to this file, never in Git.
    volumes: ["uploads:/data/files", "./secrets:/run/call-secrets:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # A small server can take several seconds to answer while it warms up, so allow it time
      # instead of marking the container unhealthy on the first slow reply.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

  worker:
    image: ${IMAGE_PREFIX:?}/medicare-ai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.scripts.run_worker"]
    volumes: ["./secrets:/run/call-secrets:ro"]
    # Load the whole .env so every provider key/model/base URL (GEMINI_API_KEY, NVIDIA_*, OPENROUTER_*,
    # OPENAI_*, GROQ_*, LLM_CUSTOM_PROVIDERS, ...) reaches the app. Values under `environment:` win.
    env_file: .env
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Reminder calls only: TURN relay. Started when COMPOSE_PROFILES=calls is set in .env.
  # Host networking because a relay needs a wide UDP range; open 3478 (udp+tcp) and
  # 49160-49200 (udp) in the cloud firewall AND on the server itself.
  turn:
    profiles: ["calls"]
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}"
      - "--realm=${TURN_REALM:-medicare.local}"
      # On OCI the VM only knows its private IP: PUBLIC_IP/PRIVATE_IP
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env as PUBLIC_IP/PRIVATE_IP}"
      - "--no-cli"
      - "--fingerprint"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-multicast-peers"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"

  frontend:
    image: ${IMAGE_PREFIX:?}/medicare-ai-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Bound to loopback: put a TLS reverse proxy (Caddy, nginx) in front on 443.
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  uploads:
