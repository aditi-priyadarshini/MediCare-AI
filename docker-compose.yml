# Development stack. The worker sends medication reminders (Phase 3).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medicare
    ports: ["127.0.0.1:5432:5432"] # loopback only; never expose the database publicly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # catches verification / reset emails: http://localhost:8025
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://medicare:${POSTGRES_PASSWORD}@postgres:5432/medicare
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: development
      FRONTEND_ORIGINS: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_DIR: /data/files
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_CUSTOM_PROVIDERS: ${LLM_CUSTOM_PROVIDERS:-[]}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: ./backend
    environment: *api-env
    volumes: [uploads:/data/files]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker: # generates upcoming doses and reminders every minute
    build: ./backend
    command: ["python", "-m", "app.scripts.run_worker"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
