# Development stack. The worker sends medication reminders (Phase 3).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: medicare
    ports: ["127.0.0.1:5432:5432"] # loopback only; never expose the database publicly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit: # catches verification / reset emails: http://localhost:8025
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://medicare:${POSTGRES_PASSWORD}@postgres:5432/medicare
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: development
      FRONTEND_ORIGINS: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_DIR: /data/files
      SCAN_ENABLED: ${SCAN_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_CUSTOM_PROVIDERS: ${LLM_CUSTOM_PROVIDERS:-[]}
      # Reminder calls (WebRTC). Off unless CALLS_ENABLED=true. See docs/REMINDER_CALLS.md.
      CALLS_ENABLED: ${CALLS_ENABLED:-false}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TTS_COMMAND: ${TTS_COMMAND:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: ./backend
    environment: *api-env
    volumes: [uploads:/data/files]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # A small server can take several seconds to answer while it warms up, so allow it time
      # instead of marking the container unhealthy on the first slow reply.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

  worker: # generates upcoming doses and reminders every minute
    build: ./backend
    command: ["python", "-m", "app.scripts.run_worker"]
    environment: *api-env
    # Push credentials (FCM service-account JSON, APNs .p8) live in ./secrets, never in Git.
    volumes: ["./secrets:/run/call-secrets:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  turn: # optional TURN relay for reminder calls: docker compose --profile calls up
    profiles: ["calls"]
    image: coturn/coturn:latest
    # Relaying media needs a wide UDP range; on a real server prefer `network_mode: host`.
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}"
      - "--realm=${TURN_REALM:-medicare.local}"
      - "--no-cli"
      - "--fingerprint"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-multicast-peers"
      # Never let a caller reach private networks through the relay.
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
